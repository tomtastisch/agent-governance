# Agent Governance project contract
#
# Purpose:
# - Defines which capabilities the governance project requires and how they
#   relate to activities and roles.
# - Does NOT define installation, deployment, versions, endpoints, credentials,
#   updates, health checks, queues, containers, or server operations.
# - Concrete providers are resolved and operated by the Agent Control Plane.

schema_version = 1

[project]
id = "agent-governance"
name = "Agent Governance"
contract_version = "1"
tool_profile = "governance-core-v1"
description = "Legacy operational Cluster 4 contract; not a governance source."

[tooling]
resolution = "server"
invoke_policy = "triggered"
fail_closed = true
require_authenticated_session = true
require_verified_runtime_manifest = true
require_immutable_session_snapshot = true
allow_client_local_fallbacks = false
allow_unregistered_providers = false

[tooling.runtime_manifest]
capability = "platform.runtime_manifest"
required_fields = [
  "session_id",
  "subject_id",
  "project_id",
  "governance_snapshot",
  "registry_snapshot",
  "capabilities",
  "permissions",
  "leases",
]

[tooling.registered_pool]
# These providers must be registered by the Agent Control Plane. Registration
# means centrally available and health-checked, not automatically invoked for
# every task. Project-bound providers may remain "unbound" until authorization.
required_providers = [
  "github-app",
  "github-mcp",
  "serena",
  "mem0",
  "context7",
  "supabase-mcp",
  "agent-knowledge-graph",
  "ace-knowledge-graph",
  "mermaid-chart",
  "superpowers-server",
  "deepseek-sparring",
  "audit-service",
  "queue-service",
  "governance-context-service",
  "agent-control-plane",
]

[tooling.core_pool]
# These capabilities must be available to every authenticated session.
# "Available" does not mean that every capability is invoked for every task.
required = [
  "identity.session",
  "platform.runtime_manifest",
  "governance.context.resolve",
  "memory.search",
  "memory.write",
  "repository.read",
  "repository.state",
  "code.symbols",
  "documentation.current",
  "knowledge.query",
  "diagram.render",
  "workflow.structured_delivery",
  "workflow.sparring",
  "queue.status",
  "audit.record",
]

[tooling.project_bound]
# These capabilities are exposed only when the current project and authenticated
# subject have a verified binding and sufficient permission.
available = [
  "repository.write",
  "repository.review",
  "repository.ci.read",
  "repository.ci.dispatch",
  "code.workspace.read",
  "code.workspace.write",
  "database.schema.read",
  "database.query",
  "database.migrate",
  "knowledge.write",
  "deployment.read",
  "deployment.write",
]

# Provider names are non-operational preferences. Versions, installation,
# credentials and deployment remain exclusively in the server-side registry.
[tooling.provider_preferences]
"identity.session" = ["github-app"]
"memory.search" = ["mem0"]
"memory.write" = ["mem0"]
"repository.read" = ["github-mcp"]
"repository.state" = ["github-mcp"]
"repository.write" = ["github-mcp"]
"repository.review" = ["github-mcp"]
"repository.ci.read" = ["github-mcp"]
"repository.ci.dispatch" = ["github-mcp"]
"code.symbols" = ["serena"]
"code.workspace.read" = ["serena"]
"code.workspace.write" = ["serena"]
"documentation.current" = ["context7"]
"database.schema.read" = ["supabase-mcp"]
"database.query" = ["supabase-mcp"]
"database.migrate" = ["supabase-mcp"]
"knowledge.query" = ["agent-knowledge-graph", "ace-knowledge-graph"]
"knowledge.write" = ["agent-knowledge-graph"]
"diagram.render" = ["mermaid-chart"]
"workflow.structured_delivery" = ["superpowers-server"]
"workflow.sparring" = ["deepseek-sparring"]
"audit.record" = ["audit-service"]
"queue.status" = ["queue-service"]
"governance.context.resolve" = ["governance-context-service"]
"platform.runtime_manifest" = ["agent-control-plane"]

[activities]
known = [
  "session_start",
  "analysis",
  "architecture",
  "planning",
  "implementation",
  "debugging",
  "refactoring",
  "testing",
  "documentation",
  "issue_triage",
  "code_review",
  "security_audit",
  "ci_investigation",
  "release",
  "installation",
  "configuration",
  "delegation",
  "mixed",
  "unknown",
]

[activities.unknown]
full_governance_context_required = true
block_if_context_cannot_be_resolved = true

[[tooling.rules]]
id = "session-bootstrap"
activities = ["session_start"]
mode = "required"
capabilities = [
  "identity.session",
  "platform.runtime_manifest",
  "governance.context.resolve",
  "memory.search",
  "queue.status",
  "audit.record",
]
reason = "Every session starts from an authenticated, verified and immutable runtime context."

[[tooling.rules]]
id = "repository-evidence"
activities = [
  "analysis",
  "architecture",
  "planning",
  "implementation",
  "debugging",
  "refactoring",
  "testing",
  "documentation",
  "issue_triage",
  "code_review",
  "security_audit",
  "ci_investigation",
  "release",
]
mode = "required_on_trigger"
condition = "repository_context_present"
capabilities = ["repository.read", "repository.state"]
reason = "Repository-dependent claims and decisions require current authoritative repository evidence."

[[tooling.rules]]
id = "semantic-code-navigation"
activities = [
  "analysis",
  "architecture",
  "implementation",
  "debugging",
  "refactoring",
  "testing",
  "code_review",
  "security_audit",
]
mode = "required_on_trigger"
condition = "source_code_relevant"
capabilities = ["code.symbols"]
reason = "Code understanding and changes must use semantic symbol and reference information when source code is relevant."

[[tooling.rules]]
id = "structured-development-workflow"
activities = [
  "architecture",
  "planning",
  "implementation",
  "debugging",
  "refactoring",
  "testing",
  "code_review",
]
mode = "required_on_trigger"
condition = "software_delivery_relevant"
capabilities = ["workflow.structured_delivery"]
reason = "Software delivery follows the centrally provided structured workflow with planning, testing, debugging and verification gates."

[[tooling.rules]]
id = "engineering-sparring"
activities = ["architecture", "planning", "debugging", "security_audit"]
mode = "required_on_trigger"
condition = "complexity_high_or_risk_high"
capabilities = ["workflow.sparring"]
reason = "High-complexity or high-risk work requires an independent structured challenge before execution or finalization."

[[tooling.rules]]
id = "current-documentation"
activities = [
  "analysis",
  "architecture",
  "implementation",
  "debugging",
  "testing",
  "security_audit",
  "configuration",
]
mode = "required_on_trigger"
condition = "external_api_library_framework_or_service_relevant"
capabilities = ["documentation.current"]
reason = "External interfaces and versions require current authoritative documentation instead of model memory."

[[tooling.rules]]
id = "knowledge-retrieval"
activities = [
  "analysis",
  "architecture",
  "planning",
  "implementation",
  "debugging",
  "code_review",
  "security_audit",
]
mode = "required_on_trigger"
condition = "cross_file_cross_service_or_historical_context_relevant"
capabilities = ["memory.search", "knowledge.query"]
reason = "Relevant prior decisions and structured relationships must be retrieved before creating parallel or contradictory conclusions."

[[tooling.rules]]
id = "diagramming"
activities = ["architecture", "planning", "documentation"]
mode = "preferred"
condition = "relationships_or_flow_are_material"
capabilities = ["diagram.render"]
reason = "Material structures and flows should be rendered as a verifiable diagram when this improves precision."

[[tooling.rules]]
id = "supabase-project"
activities = [
  "analysis",
  "architecture",
  "implementation",
  "debugging",
  "testing",
  "security_audit",
  "configuration",
]
mode = "required_on_trigger"
condition = "verified_supabase_project_binding_and_database_context_relevant"
capabilities = ["database.schema.read"]
reason = "Supabase-related work must use the bound project and its current schema as the authoritative source."

[[tooling.rules]]
id = "repository-delivery"
activities = ["implementation", "refactoring", "documentation", "release"]
mode = "required_on_trigger"
condition = "external_repository_change_authorized"
capabilities = ["repository.write"]
reason = "Authorized repository changes are performed through the centrally governed repository capability."

[[tooling.rules]]
id = "workspace-write-lease"
activities = ["implementation", "debugging", "refactoring", "testing"]
mode = "required_on_trigger"
condition = "workspace_change_authorized"
capabilities = ["code.workspace.write", "queue.status"]
reason = "Workspace changes require an exclusive verified workspace lease."

[[tooling.rules]]
id = "audit-external-effects"
activities = [
  "implementation",
  "configuration",
  "delegation",
  "release",
  "installation",
]
mode = "required_on_trigger"
condition = "external_effect_or_persistent_change"
capabilities = ["audit.record"]
reason = "Persistent or externally visible effects require structured audit evidence."

[roles.ak]
required = [
  "memory.search",
  "repository.read",
  "repository.state",
  "code.symbols",
  "knowledge.query",
]
preferred = ["diagram.render", "workflow.sparring"]
forbidden = [
  "repository.write",
  "repository.ci.dispatch",
  "code.workspace.write",
  "database.migrate",
  "deployment.write",
]

[roles.executor]
required_on_trigger = [
  "repository.state",
  "code.symbols",
  "workflow.structured_delivery",
  "queue.status",
]
allowed_when_authorized = [
  "repository.write",
  "code.workspace.write",
  "database.migrate",
  "knowledge.write",
  "deployment.write",
]

[roles.qa]
required = [
  "memory.search",
  "repository.read",
  "repository.state",
  "code.symbols",
  "audit.record",
]
forbidden = [
  "review.self_approve",
  "evidence.fabricate",
]

[roles.sec]
required = [
  "memory.search",
  "repository.read",
  "repository.state",
  "code.symbols",
  "documentation.current",
  "knowledge.query",
  "audit.record",
]
forbidden = [
  "review.self_approve",
  "evidence.fabricate",
]

[session]
pin_governance_snapshot = true
pin_registry_snapshot = true
pin_toolset = true
refresh_during_active_task = false
block_on_missing_required_capability = true
block_on_unverified_provider = true
