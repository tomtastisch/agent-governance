name: One-time npm First Publish Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-prebuild:
    name: Bootstrap native prebuild (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: "v1.0.0-rc.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify signed RC2 tag and build its native artifact
        run: |
          python3 tools/release_check.py tag "$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          npm ci --ignore-scripts
          npm run build:native
          test "$(node -p 'process.platform+"-"+process.arch')" = "${{ matrix.target }}"
          node --experimental-strip-types --test tests/installer/native-filesystem.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}/agent_governance_fs.node
          if-no-files-found: error

  publish:
    name: Verify signed RC2 and perform one-time npm bootstrap
    if: github.ref == 'refs/heads/main'
    needs: native-prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: "v1.0.0-rc.2"
      EXPECTED_VERSION: "1.0.0-rc.2"
      NPM_DIST_TAG: "next"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: prebuilds
      - name: Install exact provenance-capable npm CLI
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Verify immutable RC2 source
        run: |
          python3 tools/release_check.py tag "$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          test "$RELEASE_TAG" = "v$EXPECTED_VERSION"
      - name: Rebuild and verify complete package at signed RC2 tag
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint
          npm test
          node -e "require('node:fs').rmSync('dist',{recursive:true,force:true})"
          ./node_modules/.bin/tsc -p tsconfig.build.json
          python3 -m unittest discover -s tests -v
          python3 tools/release_manifest.py check
          python3 tools/release_check.py tree
          npm audit --audit-level=high
          npm run license:check
          REQUIRE_ALL_NATIVE_PREBUILDS=1 npm run pack:check
          npm run test:package
          tests/e2e/run_installer_fixture.sh
          tests/e2e/run_neutral_harness.sh
          git diff --exit-code
      - name: Require package and RC2 to be absent from the public registry
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://registry.npmjs.org/@tomtastisch%2fagent-governance)
          test "$STATUS" = "404"
      - name: Publish public package for first-package bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
      - name: Read back registry metadata, dist-tag, provenance, and signatures
        run: |
          PACKAGE_SPEC="@tomtastisch/agent-governance@$EXPECTED_VERSION"
          for ATTEMPT in 1 2 3 4 5 6; do
            npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org >/dev/null 2>&1 && break
            test "$ATTEMPT" = 6 && exit 1
            sleep 10
          done
          test "$(npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org)" = "$EXPECTED_VERSION"
          test "$(npm view @tomtastisch/agent-governance "dist-tags.$NPM_DIST_TAG" --registry=https://registry.npmjs.org)" = "$EXPECTED_VERSION"
          npm view "$PACKAGE_SPEC" dist --json --registry=https://registry.npmjs.org > registry-dist.json
          node -e "const d=require('./registry-dist.json');if(!d.integrity||!d.shasum||d.attestations?.provenance?.predicateType!=='https://slsa.dev/provenance/v1')process.exit(1)"
          VERIFY_ROOT="$RUNNER_TEMP/npm-bootstrap-signature-readback"
          mkdir "$VERIFY_ROOT"
          cd "$VERIFY_ROOT"
          npm init --yes >/dev/null
          npm install "$PACKAGE_SPEC" --ignore-scripts --registry=https://registry.npmjs.org
          npm audit signatures
