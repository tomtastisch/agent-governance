name: Trusted npm Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed release tag, exactly v<VERSION>"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag permitted for this version"
        required: true
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify signed tag and publish with npm OIDC
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install exact OIDC-capable npm CLI
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Verify signed tag from trusted main and select immutable source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          python3 tools/release_check.py tag "$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          case "$PACKAGE_VERSION:$NPM_DIST_TAG" in
            1.0.0-rc.*:next|1.0.0:latest) ;;
            *) echo "version and dist-tag contract mismatch" >&2; exit 1 ;;
          esac
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: Rebuild and verify package at the signed tag
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint
          npm test
          npm run build
          python3 -m unittest discover -s tests -v
          python3 tools/release_manifest.py check
          python3 tools/release_check.py tree
          npm audit --audit-level=high
          npm run license:check
          npm run pack:check
          npm run test:package
          tests/e2e/run_installer_fixture.sh
          tests/e2e/run_neutral_harness.sh
          git diff --exit-code
      - name: Publish public package through npm Trusted Publishing
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
      - name: Read back registry metadata, dist-tag, provenance, and signatures
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_SPEC="@tomtastisch/agent-governance@$PACKAGE_VERSION"
          for ATTEMPT in 1 2 3 4 5 6; do
            npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org >/dev/null 2>&1 && break
            test "$ATTEMPT" = 6 && exit 1
            sleep 10
          done
          test "$(npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org)" = "$PACKAGE_VERSION"
          test "$(npm view @tomtastisch/agent-governance "dist-tags.$NPM_DIST_TAG" --registry=https://registry.npmjs.org)" = "$PACKAGE_VERSION"
          npm view "$PACKAGE_SPEC" dist --json --registry=https://registry.npmjs.org > registry-dist.json
          node -e "const d=require('./registry-dist.json');if(!d.integrity||!d.shasum||d.attestations?.provenance?.predicateType!=='https://slsa.dev/provenance/v1')process.exit(1)"
          VERIFY_ROOT="$RUNNER_TEMP/npm-signature-readback"
          mkdir "$VERIFY_ROOT"
          cd "$VERIFY_ROOT"
          npm init --yes >/dev/null
          npm install "$PACKAGE_SPEC" --ignore-scripts --registry=https://registry.npmjs.org
          npm audit signatures
