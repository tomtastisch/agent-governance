name: Trusted npm Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed release tag, exactly v<VERSION>"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag permitted for this version"
        required: true
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  native-prebuild:
    name: Native prebuild (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify signed tag and build its native artifact
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release_check.py tag "$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          npm ci --ignore-scripts
          npm run build:native
          test "$(node -p 'process.platform+"-"+process.arch')" = "${{ matrix.target }}"
          node --experimental-strip-types --test tests/installer/native-filesystem.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}/agent_governance_fs.node
          if-no-files-found: error

  publish:
    name: Verify signed tag and publish with npm OIDC
    if: github.ref == 'refs/heads/main'
    needs: native-prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: prebuilds
      - name: Install PTY test tool on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect
      - name: Install exact OIDC-capable npm CLI
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Verify signed tag from trusted main and select immutable source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          python3 tools/release_check.py tag "$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          node - "$RELEASE_TAG" "$NPM_DIST_TAG" <<'NODE'
          const { readFileSync } = require("node:fs");
          const { version } = require("./package.json");
          const [releaseTag, distTag] = process.argv.slice(2);
          const versionBytes = readFileSync("VERSION");
          if (typeof version !== "string") {
            console.error("package and VERSION contract mismatch");
            process.exit(1);
          }
          const exactVersionBytes = Buffer.from(version, "utf8");
          const versionWithLfBytes = Buffer.from(`${version}\n`, "utf8");
          if (!versionBytes.equals(exactVersionBytes) && !versionBytes.equals(versionWithLfBytes)) {
            console.error("package and VERSION contract mismatch");
            process.exit(1);
          }
          if (releaseTag !== `v${version}`) {
            console.error("release tag and VERSION contract mismatch");
            process.exit(1);
          }
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/.exec(version);
          const expectedDistTag = match?.[4] === undefined ? "latest" : "next";
          if (match === null || distTag !== expectedDistTag) {
            console.error("version and dist-tag contract mismatch");
            process.exit(1);
          }
          NODE
      - name: Rebuild and verify package at the signed tag
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run lint
          npm test
          node -e "require('node:fs').rmSync('dist',{recursive:true,force:true})"
          ./node_modules/.bin/tsc -p tsconfig.build.json
          python3 -m unittest discover -s tests -v
          python3 tools/release_manifest.py check
          python3 tools/release_check.py tree
          npm audit --audit-level=high
          npm run license:check
          REQUIRE_ALL_NATIVE_PREBUILDS=1 npm run pack:check
          npm run test:package
          tests/e2e/run_installer_fixture.sh
          tests/e2e/run_neutral_harness.sh
          git diff --exit-code
      - name: Publish public package through npm Trusted Publishing
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"

  verify-provenance:
    name: Verify post-publish provenance and signatures (read-only)
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NPM_DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install exact provenance-capable npm CLI
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Verify published version, dist-tag and provenance (retry on transient registry propagation)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 1
          max_attempts: 20
          retry_wait_seconds: 30
          retry_on: any
          command: |
            set -euo pipefail
            PACKAGE_VERSION="${RELEASE_TAG#v}"
            PACKAGE_SPEC="@tomtastisch/agent-governance@$PACKAGE_VERSION"
            test "$(npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org)" = "$PACKAGE_VERSION"
            test "$(npm view @tomtastisch/agent-governance "dist-tags.$NPM_DIST_TAG" --registry=https://registry.npmjs.org)" = "$PACKAGE_VERSION"
            test -n "$(npm view "$PACKAGE_SPEC" dist.integrity --registry=https://registry.npmjs.org)"
            test -n "$(npm view "$PACKAGE_SPEC" dist.shasum --registry=https://registry.npmjs.org)"
            test "$(npm view "$PACKAGE_SPEC" dist.attestations.provenance.predicateType --registry=https://registry.npmjs.org)" = "https://slsa.dev/provenance/v1"
            VERIFY_ROOT="$(mktemp -d "$RUNNER_TEMP/npm-signature-readback.XXXXXX")"
            trap 'rm -rf "$VERIFY_ROOT"' EXIT
            cd "$VERIFY_ROOT"
            npm init --yes >/dev/null
            npm install "$PACKAGE_SPEC" --ignore-scripts --registry=https://registry.npmjs.org
            npm audit signatures
