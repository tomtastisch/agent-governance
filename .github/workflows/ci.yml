name: CI

# Konsistenz-Pipeline des Regelwerks (Kern §13). Da dies ein Prosa-/Governance-Repository ist,
# realisiert die Pipeline die zutreffenden Stages als reale, greifende Checks (Kern §9, §11):
# Konsistenz-/Drift-Tests (blockierend) und Link-Erreichbarkeit (advisory, netzabhängig).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consistency-tests:
    name: Konsistenz- & Drift-Tests (blockierend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regelwerk-Konsistenz prüfen
        run: python3 -m unittest discover -s tests -v

  link-liveness:
    name: Link-Erreichbarkeit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Links in tools/tools.md prüfen
        run: python3 tests/check_links.py
