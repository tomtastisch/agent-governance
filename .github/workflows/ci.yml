name: CI

# Konsistenz-Pipeline des Bundles. Da dies ein Prosa-/Governance-Repository ist,
# realisiert die Pipeline die zutreffenden Stages als reale, greifende Checks:
# Konsistenz-/Drift-Tests und Release-Metadaten (jeweils blockierend).

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  installer-package:
    name: Installer package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24", "26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install exact package toolchain
        run: npm ci --ignore-scripts
      - name: Typecheck, test, build, audit, and inspect package
        run: |
          npm run typecheck
          npm test
          npm run build
          python3 tools/release_manifest.py check
          npm audit --audit-level=high
          npm run license:check
          npm run pack:check
          npm run test:package
      - name: Run isolated installer fixture
        run: tests/e2e/run_installer_fixture.sh

  consistency-tests:
    name: Konsistenz- & Drift-Tests (blockierend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Regelwerk-Konsistenz prüfen
        run: |
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Neutralen Harness und Offlinepfad prüfen
        run: tests/e2e/run_neutral_harness.sh

  release-metadata:
    name: Release-Metadaten (blockierend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Tree-Konsistenz (VERSION, CHANGELOG, README, INSTALL)
        run: |
          python3 tools/release_check.py tree
          git diff --check

  release-validate:
    name: Release-Validierung (nur bei published)
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Release gegen Tag und VERSION prüfen
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 tools/release_check.py release "$RELEASE_TAG"
