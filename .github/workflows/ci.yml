name: CI

# Konsistenz-Pipeline des Bundles. Da dies ein Prosa-/Governance-Repository ist,
# realisiert die Pipeline die zutreffenden Stages als reale, greifende Checks:
# Konsistenz-/Drift-Tests und Release-Metadaten (jeweils blockierend).

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  consistency-tests:
    name: Konsistenz- & Drift-Tests (blockierend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regelwerk-Konsistenz prüfen
        run: |
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Neutralen Harness und Offlinepfad prüfen
        run: tests/e2e/run_neutral_harness.sh

  release-metadata:
    name: Release-Metadaten (blockierend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tree-Konsistenz (VERSION, CHANGELOG, README, INSTALL)
        run: |
          python3 tools/release_check.py tree
          git diff --check

  release-validate:
    name: Release-Validierung (nur bei published)
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release gegen Tag und VERSION prüfen
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 tools/release_check.py release "$RELEASE_TAG"
