name: CI

# Konsistenz-Pipeline des Bundles. Da dies ein Prosa-/Governance-Repository ist,
# realisiert die Pipeline die zutreffenden Stages als reale, greifende Checks:
# Konsistenz-/Drift-Tests und Release-Metadaten (jeweils blockierend).

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  native-platform:
    name: Native filesystem (${{ matrix.target }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, node: "24" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, node: "24" }
          - { os: macos-15-intel, target: darwin-x64, node: "24" }
          - { os: macos-15, target: darwin-arm64, node: "24" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Build and exercise the native security primitive
        run: |
          npm ci --ignore-scripts
          npm run build:native
          test "$(node -p 'process.platform+"-"+process.arch')" = "${{ matrix.target }}"
          node --experimental-strip-types --test tests/installer/native-filesystem.test.ts
          file "prebuilds/${{ matrix.target }}/agent_governance_fs.node"
          if test "$(uname -s)" = Darwin; then
            nm -gU "prebuilds/${{ matrix.target }}/agent_governance_fs.node"
            otool -L "prebuilds/${{ matrix.target }}/agent_governance_fs.node"
          else
            nm -gD "prebuilds/${{ matrix.target }}/agent_governance_fs.node"
            readelf -h -d "prebuilds/${{ matrix.target }}/agent_governance_fs.node"
            ldd "prebuilds/${{ matrix.target }}/agent_governance_fs.node"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}/agent_governance_fs.node
          if-no-files-found: error

  native-package:
    name: Package all native platforms
    needs: native-platform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: prebuilds
      - name: Assemble and consume the complete native package
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/tsc -p tsconfig.build.json
          file prebuilds/*/agent_governance_fs.node
          REQUIRE_ALL_NATIVE_PREBUILDS=1 npm run pack:check
          npm run test:package

  installer-package:
    name: Installer package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24", "26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install PTY test tool on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect
      - name: Install exact package toolchain
        run: npm ci --ignore-scripts
      - name: Typecheck, test, build, audit, and inspect package
        run: |
          npm run typecheck
          npm test
          npm run build
          python3 tools/release_manifest.py check
          npm audit --audit-level=high
          npm run license:check
          npm run pack:check
          npm run test:package
      - name: Run isolated installer fixture
        run: tests/e2e/run_installer_fixture.sh

  consistency-tests:
    name: Konsistenz- & Drift-Tests (blockierend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Regelwerk-Konsistenz prüfen
        run: |
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Neutralen Harness und Offlinepfad prüfen
        run: tests/e2e/run_neutral_harness.sh

  release-metadata:
    name: Release-Metadaten (blockierend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Tree-Konsistenz (VERSION, CHANGELOG, Dokumentlinks)
        run: |
          python3 tools/release_check.py tree
          git diff --check

  docs-remote:
    name: Dokumentlinks auf main (blockierend)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Kanonische Dokumentziele auf main prüfen
        run: python3 tools/release_check.py docs-remote

  release-validate:
    name: Release-Validierung (nur bei published)
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Release gegen Tag und VERSION prüfen
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 tools/release_check.py release "$RELEASE_TAG"
