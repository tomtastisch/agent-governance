# Werkzeug-Manifest (Kern §19). Prüfung anlassbezogen: fehlt ein hier gelistetes Werkzeug,
# wenn es gebraucht wird, wird es über den dokumentierten Weg nachinstalliert (Dauerfreigabe
# Kern §7.4) oder als Blocker gemeldet.

[meta]
schema = 1

[common]
# Harness-unabhängige CLI-Werkzeuge; Installation: brew bundle --file=tools/Brewfile
required = ["git", "gh", "jq"]
optional = ["gum", "shellcheck"]
install = "brew bundle --file=tools/Brewfile"

[claude]
# Claude-Code-Plugins; Aktivierung in ~/.claude/settings.json unter enabledPlugins
plugins = [
  "superpowers@claude-plugins-official",
  "code-review@claude-plugins-official",
  "pr-review-toolkit@claude-plugins-official",
  "feature-dev@claude-plugins-official",
  "serena@claude-plugins-official",
]
subagents = ["ak-agent", "st-agent", "qa-agent", "sec-agent"] # unter ~/.claude/agents/
install = "enabledPlugins in ~/.claude/settings.json setzen; Subagent-Wrapper nach ~/.claude/agents/ kopieren"

[codex]
# MCP-Server; Konfiguration in ~/.codex/config.toml unter [mcp_servers]
mcp = ["codex-orchestrator"]
install = "[mcp_servers]-Eintrag in ~/.codex/config.toml pflegen"
