# Branch- & PR-Tags — zentrale, harness-agnostische Quelle (SSOT).
#
# Der Tag ersetzt den früheren Agenten-Präfix (kein `claude/`, `codex/` mehr). Er benennt die
# fachliche ART der Änderung, nicht den Agenten — dessen Herkunft steht ohnehin in den
# Commit-Metadaten (author/committer). Branch-Schema (Kern §15): `<tag>/<modul>/<thema>/<name>`.
#
# Regeln (fail-closed):
# - Es ist genau ein `tag` aus dieser Liste zu wählen; kein Tag außerhalb der Liste.
# - Die Zuordnung Arbeit -> Tag erfolgt anhand des `description`-Kriteriums des Tags. Bei
#   gemischten Änderungen gewinnt der dominante Typ (wie bei Conventional Commits).
# - Ist kein Tag eindeutig zuordenbar, gilt `default`; bei echter Unentscheidbarkeit greift
#   Kern §7 (Blocker/Rückfrage).
# - Derselbe Tag erscheint konsistent im Branchnamen, im PR-Titel und in den Commit-Präfixen.
#
# Erweitern: neuen `[[tags]]`-Eintrag ergänzen. `tag` muss git-ref-sicher und eindeutig sein
# (Kleinbuchstaben, Ziffern, Bindestrich; Beginn mit Buchstabe). Die Konsistenz-Tests
# (`tests/test_governance.py`) erzwingen Eindeutigkeit, Zeichensatz und vollständige Felder.

default = "chore"

[[tags]]
tag = "feat"
name = "Feature"
description = "Neue, nach außen sichtbare fachliche Fähigkeit oder neues Verhalten."

[[tags]]
tag = "fix"
name = "Fehlerkorrektur"
description = "Korrektur eines fehlerhaften Verhaltens an bereits bestehendem Code."

[[tags]]
tag = "refactor"
name = "Refactoring"
description = "Struktureller Umbau ohne Änderung des äußeren, beobachtbaren Verhaltens."

[[tags]]
tag = "perf"
name = "Performance"
description = "Änderung mit primärem Ziel Laufzeit-, Speicher- oder Durchsatzverbesserung."

[[tags]]
tag = "docs"
name = "Dokumentation"
description = "Ausschließlich Dokumentation oder Regelwerk-Prosa (kein Produktivcode-Verhalten)."

[[tags]]
tag = "test"
name = "Tests"
description = "Ausschließlich Tests hinzufügen oder ändern, ohne Produktivcode-Verhalten zu ändern."

[[tags]]
tag = "build"
name = "Build & Abhängigkeiten"
description = "Build-System, Paketierung oder Abhängigkeiten (z. B. Brewfile, Lockfiles)."

[[tags]]
tag = "ci"
name = "CI & Automatisierung"
description = "CI-Pipeline, Workflows oder sonstige Automatisierung der Auslieferung."

[[tags]]
tag = "chore"
name = "Wartung"
description = "Wartung und Sonstiges ohne fachliche Verhaltensänderung; Fallback bei Unentschiedenheit."
