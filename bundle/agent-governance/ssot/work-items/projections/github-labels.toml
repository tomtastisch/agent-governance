# Titelmarker sind eine zusätzliche Projektion, niemals eine zweite fachliche Authority.
# Formalisiert wird ausschließlich der real weiterhin genutzte, eindeutig aus der
# Classification-SSOT ableitbare Horizontmarker. Weitere Legacy-Marker ([CLI], [WORKFLOW], …)
# erkennt der read-only Diagnoseparser, sie sind aber kein kanonischer Projektionsvertrag.
[title_markers.horizon_future]
classification = "horizon.future"
marker = "[FUTURE]"
