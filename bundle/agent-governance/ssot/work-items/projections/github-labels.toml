# GitHub-Label- und Titelmarker-Projektionen der Work-Item-Klassifikation.
#
# Projektion != fachliche Identität. Der kanonische Classifier ist ausschließlich
# `classifications.toml`. Diese Datei bildet stabile Classification-IDs deterministisch auf
# GitHub-Labels und — wo real weiterhin sinnvoll — auf Titelmarker ab. Eine Änderung eines
# Anzeigenamens hier ändert die kanonische ID nicht.
#
# Alle Einträge unter [projections.*] sind managed: Agent Governance besitzt den
# Projektionsvertrag und darf bei einer später autorisierten Mutation Existenz, Name,
# Beschreibung und Farbe gegen diese SSOT prüfen. Unmanaged ist eine Klassifikation des
# read-only GitHub-Inventars, kein hier deklariertes Feld. Diese Datei führt niemals selbst
# eine GitHub-Mutation aus.
schema_version = 1

[projections.semver_major]
classification = "semver.major"
name = "semver:major"
description = "Erfordert voraussichtlich eine nicht rückwärtskompatible Major-Version"
color = "B60205"
aliases = []

[projections.semver_minor]
classification = "semver.minor"
name = "semver:minor"
description = "Erfordert voraussichtlich eine neue rückwärtskompatible Funktionalität"
color = "1D76DB"
aliases = []

[projections.semver_patch]
classification = "semver.patch"
name = "semver:patch"
description = "Erfordert voraussichtlich eine rückwärtskompatible Korrektur oder Dokumentationsänderung"
color = "0E8A16"
aliases = []

[projections.semver_none]
classification = "semver.none"
name = "semver:none"
description = "Erfordert voraussichtlich keine neue Paketversion"
color = "6E7781"
aliases = []

[projections.semver_pending]
classification = "semver.pending"
name = "semver:pending"
description = "SemVer-Auswirkung ist noch nicht ausreichend geklärt"
color = "D4C5F9"
aliases = []

