schema_version = 2
local_rules = "local/user-rules.md"

[catalogs]
triggers = "catalogs/triggers.toml"
policy_tags = "catalogs/policy-tags.toml"
scopes = "catalogs/scopes.toml"
tools = "catalogs/tools.toml"
commands = "catalogs/commands.toml"
discovery_signals = "catalogs/discovery-signals.toml"

[routing]
unknown = "block"
ambiguous = "block"

[modules.invariants]
path = "modules/invariants.md"
triggers = ["external_effect", "security_sensitive_change"]
dependencies = []

[modules.enforcement]
path = "modules/enforcement.md"
triggers = ["external_effect"]
dependencies = ["invariants"]

[modules.evidence]
path = "modules/evidence.md"
triggers = [
  "analysis",
  "research",
  "planning",
  "architecture",
  "debugging",
  "testing",
  "documentation",
  "release",
  "security_review",
  "quality_review",
  "triage",
]
dependencies = []

[modules.workflow]
path = "modules/workflow.md"
triggers = ["planning", "implementation", "refactoring", "debugging", "triage"]
dependencies = ["evidence"]

[modules.architecture]
path = "modules/architecture.md"
triggers = ["architecture", "refactoring"]
dependencies = ["evidence"]

[modules.delivery]
path = "modules/delivery.md"
triggers = [
  "implementation",
  "refactoring",
  "testing",
  "documentation",
  "release",
  "quality_review",
]
dependencies = ["evidence"]

[modules.security]
path = "modules/security.md"
triggers = ["security_sensitive_change", "security_review"]
dependencies = ["evidence", "delivery"]

[modules.tool_routing]
path = "modules/tool-routing.md"
triggers = [
  "ads_data",
  "agent_dependencies",
  "agent_package_provenance",
  "aggregation",
  "authoritative_documentation",
  "backend_authentication",
  "backend_diagnostics",
  "calculation",
  "canonical_memory_verification",
  "commerce_metrics",
  "cross_channel_marketing_analysis",
  "data_visualization",
  "database_migration",
  "database_schema",
  "debugging",
  "dependency_drift",
  "edge_functions",
  "git_repository",
  "github_connector_required",
  "github_remote",
  "implementation",
  "initiative_tracking",
  "issue_tracking",
  "marketing_data",
  "metric_analysis",
  "object_storage",
  "planning",
  "postgresql",
  "project_tracking",
  "quality_review",
  "realtime_backend",
  "repository_verification",
  "row_level_security",
  "security_review",
  "statistical_analysis",
  "structured_data",
  "tabular_data",
  "testing",
  "tool_selection",
  "work_status_tracking",
]
dependencies = ["security"]

[modules.templates]
path = "modules/templates.md"
triggers = [
  "implementation",
  "refactoring",
  "testing",
  "documentation",
  "release",
  "quality_review",
  "security_review",
  "context_handoff",
  "status_reporting",
]
dependencies = ["delivery"]

[modules.context]
path = "modules/context.md"
triggers = ["long_task", "context_handoff"]
dependencies = ["templates"]

[roles.architecture]
path = "roles/architecture.md"
triggers = ["role_architecture"]
modules = ["evidence", "architecture", "invariants", "delivery"]

[roles.triage]
path = "roles/triage.md"
triggers = ["role_triage"]
modules = ["evidence", "workflow", "invariants"]

[roles.quality_assurance]
path = "roles/quality-assurance.md"
triggers = ["role_quality_assurance"]
modules = ["evidence", "delivery", "templates"]

[roles.security_review]
path = "roles/security-review.md"
triggers = ["role_security_review"]
modules = ["evidence", "security", "invariants", "templates"]
